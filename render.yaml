services:
  - type: web
    name: estoque-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: developement  # corrigi o nome da branch
    numInstances: 1
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: SENHA_JWT
        sync: false

databases:
  - name: estoque-db
    databaseName: estoque_db
    user: estoque_user
    plan: free
    region: oregon