# render.yaml (corrigido — Postgres em `databases`)
services:
  - type: web
    name: estoque-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: SENHA_JWT
        sync: false

databases:
  - type: postgres
    name: estoque-db
    plan: free
    region: oregon
    postgresVersion: "15"
