# render.yaml (corrigido)
services:
  # 1. A Aplicação Web (Flask/Gunicorn)
  - type: web
    name: estoque-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db       
          property: connectionString
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: SENHA_JWT
        sync: false

# 2. Defina o Postgres na lista `databases`
databases:
  - type: postgres
    name: estoque-db
    plan: free